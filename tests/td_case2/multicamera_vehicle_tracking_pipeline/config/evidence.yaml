evidence:
  enabled: true

  output_root: artifacts

  collect_first: true
  collect_middle: true
  collect_last: true
  collect_highest_confidence: true
  collect_largest: true
  collect_sharpest: true
  collect_best_overall: true

  max_candidates_per_track: 7

  minimum_crop_width: 40
  minimum_crop_height: 40
  minimum_detection_confidence: 0.20

  bbox_padding_ratio: 0.05
  padding_ratio_x: 0.08
  padding_ratio_y: 0.08
  minimum_padding_pixels: 8
  clip_to_frame: true
  annotate_all_observations: false
  visibility_weight: 0.30
  detection_confidence_weight: 0.20
  sharpness_weight: 0.15
  centeredness_weight: 0.15
  bbox_area_weight: 0.10
  edge_penalty_weight: 0.10

  save_candidate_crops: false
  save_final_selected_crops: true

  jpeg_quality: 90
