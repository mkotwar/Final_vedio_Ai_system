florence:
  enabled: true

  model_path: null
  adapter_path: null
  processor_path: null

  model_path_env: FLORENCE_MODEL_PATH
  adapter_path_env: FLORENCE_ADAPTER_PATH
  processor_path_env: FLORENCE_PROCESSOR_PATH

  device: auto
  dtype: auto
  trust_remote_code: true
  local_files_only: true
  load_once: true
  allow_cpu_fallback: true

  task_timeout_seconds: 60
  max_retries: 1

  colour_prompt: "<VQA>What is the primary color of the vehicle?"

