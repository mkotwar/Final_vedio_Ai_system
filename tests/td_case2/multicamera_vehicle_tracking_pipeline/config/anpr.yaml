anpr:
  enabled: true

  plate_detector:
    backend: yolo
    model_path: null
    model_path_env: PLATE_DETECTOR_MODEL_PATH
    device: auto
    confidence_threshold: 0.18
    iou_threshold: 0.45
    inference_image_size: 1280
    maximum_detections_per_vehicle_crop: 5

  vehicle_evidence_roles:
    - HIGHEST_CONFIDENCE
    - SHARPEST
    - BEST_OVERALL
    - LARGEST
    - MIDDLE
    - FIRST
    - LAST

  maximum_vehicle_crops_per_track: 8

  plate_selection:
    minimum_width: 8
    minimum_height: 4
    minimum_area: 64
    minimum_aspect_ratio: 1.5
    maximum_aspect_ratio: 8.0
    confidence_weight: 0.35
    sharpness_weight: 0.30
    size_weight: 0.20
    aspect_ratio_weight: 0.10
    edge_penalty_weight: 0.05
    heuristic_region_penalty: 0.20

  ocr:
    backend: florence
    minimum_confidence: 0.50
    maximum_retries: 1
    retry_with_preprocessing: true
    fallback_to_other_plate_candidates: true
    maximum_plate_candidates_for_ocr: 5
    max_variants_per_candidate: 6
    early_stop_on_verified: true
    minimum_support_frames_for_verified: 2
    task_prompt: <OCR>

  validation:
    country_profile: INDIA
    preserve_raw_text: true
    minimum_normalized_length: 4
    maximum_normalized_length: 12
    allow_unverified_result: true
    persist_only_verified_as_primary: true

  fallback:
    enabled: true
    vehicle_crop_padding_ratio: 0.15
    enable_original_frame_region: true
    enable_padded_vehicle_crop: true
    heuristic_regions_by_class:
      3WHEELER:
        - name: lower_right
          x_min_ratio: 0.50
          y_min_ratio: 0.55
          x_max_ratio: 1.00
          y_max_ratio: 1.00
        - name: lower_center
          x_min_ratio: 0.20
          y_min_ratio: 0.55
          x_max_ratio: 0.80
          y_max_ratio: 1.00
      AUTO_RICKSHAW:
        - name: lower_right
          x_min_ratio: 0.50
          y_min_ratio: 0.55
          x_max_ratio: 1.00
          y_max_ratio: 1.00
        - name: lower_center
          x_min_ratio: 0.20
          y_min_ratio: 0.55
          x_max_ratio: 0.80
          y_max_ratio: 1.00
      BUS:
        - name: lower_center
          x_min_ratio: 0.20
          y_min_ratio: 0.55
          x_max_ratio: 0.80
          y_max_ratio: 1.00
      TRUCK:
        - name: lower_center
          x_min_ratio: 0.20
          y_min_ratio: 0.55
          x_max_ratio: 0.80
          y_max_ratio: 1.00
      CAR:
        - name: lower_center
          x_min_ratio: 0.25
          y_min_ratio: 0.55
          x_max_ratio: 0.75
          y_max_ratio: 1.00

  media:
    save_plate_crops: true
    save_preprocessed_plate_crops: true
    artifact_subdirectory: plate_evidence

  persist_result: true
  fail_pipeline_on_error: false
