vehicle_detector:
  model_path: models/vehicle_detection/best_old.pt
  fallback_model_path: yolov8n.pt
  allow_fallback: true
  device: auto
  iou_threshold: 0.45
  image_size: 640
  allowed_classes:
    - 3wheeler
    - car
    - bus
    - truck
    - motorcycle
  class_confidence_thresholds:
    enabled: true
    classes:
      3wheeler: 0.65
      car: 0.7
      bus: 0.75
      truck: 0.75
      motorcycle: 0.25
