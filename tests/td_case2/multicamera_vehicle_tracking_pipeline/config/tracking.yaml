tracking:
  behavior_mode: standard_bytetrack
  backend: supervision_bytetrack
  track_activation_threshold: 0.15
  lost_track_buffer: 30
  minimum_matching_threshold: 0.80
  frame_rate: 20
  minimum_consecutive_frames: 1
  track_high_thresh: 0.15
  track_low_thresh: 0.10
  new_track_thresh: 0.30
  match_thresh: 0.80
  track_buffer: 30
  min_confirmed_observations: 3
  max_lost_frames: 30
  preserve_state_per_camera: true
  track_class:
    strategy: confidence_weighted_majority
    minimum_observations: 3
    minimum_winner_ratio: 0.50
  fragment_linking:
    enabled: true
    maximum_gap_seconds: 1.5
    minimum_spatial_score: 0.55
    minimum_class_compatibility: 0.50
    require_no_time_overlap: true
    reject_verified_plate_conflict: true
  identity_continuity:
    enabled: true
    minimum_spatial_score: 0.20
    minimum_class_compatibility: 0.50
    maximum_area_ratio: 3.50
    hard_split_spatial_score: 0.08
